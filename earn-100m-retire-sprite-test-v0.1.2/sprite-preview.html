<main class="wrap"><header class="head"><div><h1>咪与母鸡 · 游戏精灵测试</h1><p>透明 SVG · 统一 64×64 坐标 · 实际游戏尺寸 44px</p></div><div class="tag">尚未嵌入正式游戏</div></header>
  <section class="grid"><section class="panel detail"><h2>放大检查</h2><div class="zoom-grid"><div><div class="zoom-box"><svg id="miZoom" viewBox="0 0 64 64"></svg></div><div class="name">咪 · 玳瑁</div><div class="controls" data-target="mi"><button data-action="idle">待机</button><button class="active" data-action="walk">行走</button><button data-action="sit">坐下</button><button data-action="sleep">睡觉</button></div></div><div><div class="zoom-box"><svg id="henZoom" viewBox="0 0 64 64"></svg></div><div class="name">母鸡</div><div class="controls" data-target="hen"><button data-action="idle">待机</button><button class="active" data-action="walk">行走</button><button data-action="peck">啄食</button></div></div></div><div class="ok">这两个角色使用的是实际可嵌入素材。页面会把每帧的矢量路径直接复制进可见 SVG；所有帧共享相同坐标、脚底基准和透明背景。</div></section>
  <section class="panel stage-card"><h2>游戏实际尺寸</h2><div class="stage"><div class="pond"></div><div class="field"><i class="crop"></i><i class="crop"></i><i class="crop"></i><i class="crop"></i><i class="crop"></i><i class="crop"></i><i class="crop"></i><i class="crop"></i></div><div class="path"></div><div class="sprite mi-live"><svg id="miLive" viewBox="0 0 64 64"></svg></div><div class="sprite hen-live"><svg id="henLive" viewBox="0 0 64 64"></svg></div><div class="scale-note">右侧角色为预计嵌入尺寸</div></div><div class="info"><div><b>统一坐标</b><span>每帧 viewBox 64×64</span></div><div><b>透明背景</b><span>可直接叠加在地图上</span></div><div><b>脚底锚点</b><span>统一为 32, 54</span></div></div></section></section>
</main>
<script>
const animations={mi:{idle:['mi-idle'],walk:['mi-walk-1','mi-walk-2'],sit:['mi-sit'],sleep:['mi-sleep']},hen:{idle:['hen-idle'],walk:['hen-walk-1','hen-walk-2'],peck:['hen-idle','hen-peck']}};const state={mi:'walk',hen:'walk'},frame={mi:0,hen:0};function cloneFrame(name){const source=document.getElementById(name),fragment=document.createDocumentFragment();for(const child of source.children){if(child.tagName.toLowerCase()==='use'){const ref=(child.getAttribute('href')||child.getAttribute('xlink:href')||'').replace('#',''),group=document.createElementNS('http://www.w3.org/2000/svg','g');group.append(cloneFrame(ref));fragment.append(group)}else fragment.append(child.cloneNode(true))}return fragment}function paint(id,name){const target=document.getElementById(id);target.replaceChildren(cloneFrame(name))}document.querySelectorAll('.controls button').forEach(btn=>btn.addEventListener('click',()=>{const box=btn.closest('.controls'),who=box.dataset.target;state[who]=btn.dataset.action;frame[who]=0;box.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===btn));render(who)}));function render(who){const a=animations[who][state[who]],name=a[frame[who]%a.length];paint(who+'Zoom',name);paint(who+'Live',name)}render('mi');render('hen');setInterval(()=>{for(const who of ['mi','hen']){frame[who]++;render(who)}},190);let mx=260,hx=430,md=1,hd=-1;function move(){const stage=document.querySelector('.stage'),w=stage.clientWidth;mx+=.32*md;hx+=.22*hd;if(mx>w-75||mx<150)md*=-1;if(hx>w-70||hx<250)hd*=-1;const m=document.querySelector('.mi-live'),h=document.querySelector('.hen-live');m.style.left=mx+'px';h.style.left=hx+'px';m.style.transform=`scaleX(${md})`;h.style.transform=`scaleX(${hd})`;requestAnimationFrame(move)}requestAnimationFrame(move);
</script></body></html>
