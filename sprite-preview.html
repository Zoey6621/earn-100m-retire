<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>咪与母鸡 · 游戏精灵测试</title>
  <style>
    :root{--ink:#422f28;--line:#76513d;--paper:#fff8e5;--mint:#69c98d;--gold:#f2be55}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:#bee99e;background-image:linear-gradient(rgba(255,255,255,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.14) 1px,transparent 1px);background-size:16px 16px}.wrap{width:min(1100px,100%);margin:auto}.head{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:14px}.head h1{margin:0;font-size:clamp(24px,4vw,38px)}.head p{margin:5px 0 0;color:#745846}.tag{padding:7px 10px;border:2px solid var(--line);border-radius:7px;background:#fff1bd;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1.5fr;gap:13px}.panel{border:3px solid var(--line);border-radius:12px;background:var(--paper);box-shadow:0 5px 0 rgba(70,48,32,.2)}.detail{padding:16px}.detail h2,.stage-card h2{margin:0 0 11px}.zoom-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.zoom-box{display:grid;place-items:center;min-height:260px;border:2px solid #a17b5b;border-radius:9px;background-color:#e5d9bc;background-image:linear-gradient(45deg,#eee5d0 25%,transparent 25%),linear-gradient(-45deg,#eee5d0 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#eee5d0 75%),linear-gradient(-45deg,transparent 75%,#eee5d0 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}.zoom-box svg{width:210px;height:210px}.name{text-align:center;margin-top:7px;font-weight:900}.controls{display:flex;gap:7px;margin-top:13px;flex-wrap:wrap}.controls button{padding:8px 11px;border:2px solid var(--line);border-radius:7px;background:#fff4ca;cursor:pointer;font-weight:800}.controls button.active{background:var(--gold);transform:translateY(1px)}.stage-card{padding:16px}.stage{position:relative;height:440px;overflow:hidden;border:3px solid #557a54;border-radius:10px;background:#67c98c}.stage:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#8be0a2 1.5px,transparent 1.5px);background-size:25px 25px;opacity:.65}.pond{position:absolute;right:35px;top:35px;width:155px;height:95px;border:7px solid #507e63;border-radius:45% 50% 42% 47%;background:#55b9d5;box-shadow:inset 0 0 0 5px #9ce1df}.field{position:absolute;left:36px;top:45px;display:grid;grid-template-columns:repeat(4,28px);gap:7px;padding:14px;border:5px solid #76503a;background:#aa7045}.crop{position:relative;width:28px;height:34px}.crop:before{content:"";position:absolute;left:13px;top:4px;width:4px;height:28px;background:#347344}.crop:after{content:"";position:absolute;left:5px;top:13px;width:19px;height:8px;border-radius:50%;background:#e9bb48;box-shadow:3px 8px 0 #4f9852}.path{position:absolute;left:0;right:0;bottom:0;height:93px;border-top:5px solid #bb8752;background:#d9a866}.sprite{position:absolute;z-index:3;width:44px;height:44px;filter:drop-shadow(0 3px 1px rgba(55,42,31,.18))}.sprite svg{width:100%;height:100%;overflow:visible}.mi-live{left:260px;top:230px}.hen-live{left:430px;top:180px}.scale-note{position:absolute;z-index:5;left:10px;bottom:10px;padding:6px 9px;border:2px solid var(--line);border-radius:6px;background:#fff8de;font-size:12px;font-weight:800}.info{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:13px}.info div{padding:10px;border:2px solid #a17b5b;border-radius:8px;background:#fff1bf}.info b{display:block;margin-bottom:4px}.info span{font-size:12px;color:#745846}.ok{margin-top:13px;padding:11px;border:2px dashed #5d9368;border-radius:8px;background:#e0f3c4;font-size:13px;line-height:1.6}@media(max-width:850px){.grid{grid-template-columns:1fr}.stage{height:390px}.zoom-grid{grid-template-columns:1fr 1fr}.zoom-box{min-height:210px}.zoom-box svg{width:170px;height:170px}}@media(max-width:540px){body{padding:8px}.head{align-items:start;flex-direction:column}.zoom-grid,.info{grid-template-columns:1fr}.stage{height:340px}.mi-live{left:40%;top:58%}.hen-live{left:70%;top:42%}}
  </style>
</head>
<body><main class="wrap"><header class="head"><div><h1>咪与母鸡 · 游戏精灵测试</h1><p>透明 SVG · 统一 64×64 坐标 · 实际游戏尺寸 44px</p></div><div class="tag">尚未嵌入正式游戏</div></header>
  <section class="grid"><section class="panel detail"><h2>放大检查</h2><div class="zoom-grid"><div><div class="zoom-box"><svg viewBox="0 0 64 64"><use id="miZoom" href="farm-sprite-test.svg#mi-walk-1"/></svg></div><div class="name">咪 · 玳瑁</div><div class="controls" data-target="mi"><button data-action="idle">待机</button><button class="active" data-action="walk">行走</button><button data-action="sit">坐下</button><button data-action="sleep">睡觉</button></div></div><div><div class="zoom-box"><svg viewBox="0 0 64 64"><use id="henZoom" href="farm-sprite-test.svg#hen-walk-1"/></svg></div><div class="name">母鸡</div><div class="controls" data-target="hen"><button data-action="idle">待机</button><button class="active" data-action="walk">行走</button><button data-action="peck">啄食</button></div></div></div><div class="ok">这两个角色使用的是实际可嵌入素材。切换动作时调用 SVG Symbol ID；所有帧共享相同坐标、脚底基准和透明背景。</div></section>
  <section class="panel stage-card"><h2>游戏实际尺寸</h2><div class="stage"><div class="pond"></div><div class="field"><i class="crop"></i><i class="crop"></i><i class="crop"></i><i class="crop"></i><i class="crop"></i><i class="crop"></i><i class="crop"></i><i class="crop"></i></div><div class="path"></div><div class="sprite mi-live"><svg viewBox="0 0 64 64"><use id="miLive" href="farm-sprite-test.svg#mi-walk-1"/></svg></div><div class="sprite hen-live"><svg viewBox="0 0 64 64"><use id="henLive" href="farm-sprite-test.svg#hen-walk-1"/></svg></div><div class="scale-note">右侧角色为预计嵌入尺寸</div></div><div class="info"><div><b>统一坐标</b><span>每帧 viewBox 64×64</span></div><div><b>透明背景</b><span>可直接叠加在地图上</span></div><div><b>脚底锚点</b><span>统一为 32, 54</span></div></div></section></section>
</main>
<script>
const source='farm-sprite-test.svg#',animations={mi:{idle:['mi-idle'],walk:['mi-walk-1','mi-walk-2'],sit:['mi-sit'],sleep:['mi-sleep']},hen:{idle:['hen-idle'],walk:['hen-walk-1','hen-walk-2'],peck:['hen-idle','hen-peck']}};const state={mi:'walk',hen:'walk'},frame={mi:0,hen:0};function setUse(id,name){document.getElementById(id).setAttribute('href',source+name)}document.querySelectorAll('.controls button').forEach(btn=>btn.addEventListener('click',()=>{const box=btn.closest('.controls'),who=box.dataset.target;state[who]=btn.dataset.action;frame[who]=0;box.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===btn));render(who)}));function render(who){const a=animations[who][state[who]],name=a[frame[who]%a.length];setUse(who+'Zoom',name);setUse(who+'Live',name)}setInterval(()=>{for(const who of ['mi','hen']){frame[who]++;render(who)}},190);let mx=260,hx=430,md=1,hd=-1;function move(){const stage=document.querySelector('.stage'),w=stage.clientWidth;mx+=.32*md;hx+=.22*hd;if(mx>w-75||mx<150)md*=-1;if(hx>w-70||hx<250)hd*=-1;const m=document.querySelector('.mi-live'),h=document.querySelector('.hen-live');m.style.left=mx+'px';h.style.left=hx+'px';m.style.transform=`scaleX(${md})`;h.style.transform=`scaleX(${hd})`;requestAnimationFrame(move)}requestAnimationFrame(move);
</script></body></html>
